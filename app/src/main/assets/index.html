<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><title>Zen Player</title>

<style>
:root{--bg:#07070a;--card:#14141a;--fg:#f5f5f7;--mut:#9a9aa8;--ac:#ff2b3a;--ac2:#a3000f;--line:#ffffff14;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 0% -5%,#3a0a10 0,transparent 60%),var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
svg{width:24px;height:24px;flex:none}
button,label{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hd{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}.hd>div:nth-child(2){flex:1}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 6px 20px #ff2b3a55}
.hd h1{margin:0;font-size:22px;line-height:1.1}.hd h1 b{color:var(--ac)}.hd small{color:var(--mut);font-size:11px}
.prem{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;border:1px solid #d4a63a;color:#f3c75a;background:#2a210a;font-size:13px;font-weight:600}.prem svg{width:16px;height:16px}
.sr{display:flex;gap:10px;padding:8px 16px}
.sbx{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 14px;color:var(--mut)}
.sbx input{flex:1;background:none;border:0;outline:0;color:var(--fg);font-size:15px;padding:14px 0;min-width:0}
.sr>button{width:48px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.tabs{display:flex;gap:8px;padding:6px 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px;font-weight:600;color:var(--mut)}.tabs svg{width:18px;height:18px}
.tabs .on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 6px 18px #ff2b3a44}
#main{padding-bottom:190px}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}.sh h2{margin:0;font-size:20px;flex:1}.sh span{color:var(--mut);font-size:13px}
.sh button{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.tr{display:flex;gap:10px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px}
.tl{min-width:100px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}.gr .tl{min-width:0}
.tl svg{width:46px;height:46px;color:var(--c)}.tl b{font-size:14px;word-break:break-word}.tl small{color:var(--mut);font-size:12px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);margin:0 16px 10px;padding:8px;border-radius:18px;position:relative}
.th{width:38%;max-width:170px;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#2a0d12,#111) center/cover;position:relative;flex:none}
.dur{position:absolute;right:6px;bottom:6px;background:#000b;padding:2px 7px;border-radius:8px;font-size:12px;font-weight:600}
.inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-right:26px}.inf b{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mt{color:var(--mut);font-size:12.5px}
.bar{height:3px;background:#ffffff1c;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mm{position:absolute;right:4px;top:6px;width:30px;height:30px;color:var(--mut);display:grid;place-items:center}
.pl{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 4px 14px #ff2b3a55}.pl svg{width:22px;height:22px}
.empty{text-align:center;color:var(--mut);padding:60px 30px;line-height:1.8}
#dock{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:#14141ae6;backdrop-filter:blur(14px);border:1px solid var(--line)}
#dock>div{flex:1;font-size:13px;min-width:0}.sbar{height:5px;background:#ffffff1c;border-radius:5px;margin-top:6px;overflow:hidden}.sbar i{display:block;height:100%;width:2%;background:linear-gradient(90deg,var(--ac),#ff7a45)}
#free{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;border:1px solid #ff2b3a88;background:#ff2b3a22;font-weight:600;font-size:13px;white-space:nowrap}#free svg{width:18px;height:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:#0c0c10f2;backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav>*{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mut);padding:8px 0;border-radius:16px}nav .on{color:#fff;background:#ff2b3a22}
nav .ct{width:60px;height:60px;border-radius:50%;margin:-26px auto 0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 24px #ff2b3a77;justify-content:center;padding:0}.ct svg{width:30px;height:30px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:90;display:none;font-size:14px;max-width:88%;text-align:center}
.fi{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#pl{position:fixed;inset:0;background:#000;z-index:20;display:none;touch-action:none;user-select:none}
#v{width:100%;height:100%;object-fit:contain;background:#000}#v::cue{background:#000b;color:#fff;font-size:1.1em}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#hud{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:#000a;padding:12px 20px;border-radius:16px;font-size:20px;font-weight:700;display:none;pointer-events:none;backdrop-filter:blur(8px)}
#ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s;background:linear-gradient(#000c,transparent 28%,transparent 60%,#000d);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);pointer-events:none}
#ctl.h{opacity:0}#ctl>*{pointer-events:auto}#ctl.h>*{pointer-events:none}
.tp{display:flex;align-items:center;gap:10px;padding:10px 14px}.tt{flex:1;min-width:0}.tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{color:#ccc;font-size:12px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ffffff18;backdrop-filter:blur(8px)}
.bt{padding:6px 16px 14px}.sk{display:flex;align-items:center;gap:12px;font-size:13px;font-variant-numeric:tabular-nums}
.rw{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 0 28px #ff2b3a88}.big svg{width:34px;height:34px}
#ul{position:absolute;left:14px;top:50%;margin-top:-22px;display:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--ac) var(--p,0%),#ffffff33 var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
#sh{position:fixed;inset:0;z-index:60;display:none;background:#0008}
#shp{position:absolute;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:#15151cf7;backdrop-filter:blur(20px);border-radius:24px 24px 0 0;padding:14px 8px calc(14px + env(safe-area-inset-bottom,0px))}
@media(orientation:landscape){#shp{left:auto;right:12px;top:10px;bottom:10px;width:360px;border-radius:22px;max-height:none}}
#shp h3{margin:4px 14px 8px;font-size:15px;color:var(--mut);font-weight:600}
.mr{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;font-size:15px}.mr:active{background:#ffffff12}.mr>span{flex:1}.mr em{font-style:normal;color:var(--mut);font-size:14px}.mr svg{width:22px;height:22px}
.sw{width:46px;height:26px;border-radius:13px;background:#ffffff2a;position:relative}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on:after{left:23px}

e.muted=true;e.preload='metadata';e.src=u;setTimeout(()=>fin({}),6000);e.onerror=()=>fin({});
e.onloadedmetadata=()=>{e.currentTime=Math.min(e.duration*.1,30)||0};
e.onseeked=()=>{const o={dur:e.duration,w:e.videoWidth,h:e.videoHeight};try{const c=document.createElement('canvas');c.width=320;c.height=Math.round(320*e.videoHeight/e.videoWidth)||180;c.getContext('2d').drawImage(e,0,0,c.width,c.height);o.thumb=c.toDataURL('image/jpeg',.6)}catch(x){}fin(o)}})}
async function load(){all=await op('readonly',s=>s.getAll());render();stor()}
async function stor(){try{const e=await navigator.storage.estimate(),u=e.usage||0,q=e.quota||1;$('#st').textContent='Storage: '+sz(u)+' / '+sz(q);$('#sf2').style.width=Math.max(2,u/q*100)+'%'}catch(e){}}
async function addFiles(fs){fs=[...fs];const subs={};
for(const f of fs)if(/\.(srt|vtt)$/i.test(f.name)){let t=await f.text();if(!/^\s*WEBVTT/.test(t))t='WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2');subs[f.name.replace(/\.[^.]+$/,'').toLowerCase()]=t}
const vs=fs.filter(f=>f.type.startsWith('video/')||/\.(mkv|mp4|avi|webm|mov|m4v|3gp)$/i.test(f.name));
if(!vs.length)return toast('Koi video nahi mili');let i=0;
for(const f of vs){const id=f.name+'|'+f.size;toast('Saving '+(++i)+'/'+vs.length+' ...');if(all.some(x=>x.id===id))continue;
const p=parse(f.name),m=await meta(f);
try{const r={id,name:f.name,size:f.size,series:p.series,ep:p.ep,blob:f,pos:0,added:Date.now(),sub:subs[f.name.replace(/\.[^.]+$/,'').toLowerCase()],...m};await op('readwrite',s=>s.put(r));all.push(r)}catch(e){toast('Save fail: '+f.name)}}
toast('✓ '+vs.length+' video process ho gayi');try{navigator.storage.persist()}catch(e){}load()}
['#fi','#fx','#fo'].forEach(s=>$(s).onchange=e=>{addFiles(e.target.files);e.target.value=''});
const cmp=(a,b)=>a.series.toLowerCase().localeCompare(b.series.toLowerCase())||a.ep-b.ep||a.name.localeCompare(b.name,undefined,{numeric:true});
const COL=['#ff4d5a','#ff8a3d','#ffd166','#e6e6ee','#ff6f91','#ff3b30'];
function row(r){const p=r.dur?Math.min(100,(r.pos||0)/r.dur*100):0,id=encodeURIComponent(r.id);
return`<div class="it" data-id="${id}"><div class="th" style="${r.thumb?`background-image:url(${r.thumb})`:''}"><span class="dur">${r.dur?fmt(r.dur):''}</span></div><div class="inf"><b>${esc(title(r))}</b><span class="mt">${res(r)} • ${sz(r.size||0)}${r.fav?' • ♥':''}</span><div class="bar"><i style="width:${p}%"></i></div></div><button class="mm" data-m="${id}">${ic('more')}</button><span class="pl">${ic('play')}</span></div>`}
function render(){const qq=$('#q').value.toLowerCase(),M=$('#main');
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab&&!sel));$('#nh').classList.toggle('on',tab==='lib'&&!sel);
const match=r=>!qq||(r.name+r.series).toLowerCase().includes(qq),g={};all.forEach(r=>(g[r.series.toLowerCase()]??=[]).push(r));const ks=Object.keys(g).sort();
const tiles=a=>a.map((k,i)=>`<div class="tl" data-s="${encodeURIComponent(k)}" style="--c:${COL[i%6]}">${ic('folder')}<b>${esc(g[k][0].series)}</b><small>${g[k].length} videos</small></div>`).join('');
let h='',L=null;
if(!all.length){M.innerHTML='<div class="empty">📂<br>Library khali hai.<br>Neeche <b>Gallery</b> ya <b>Files</b> dabao aur videos chuno.<br>Episodes apne aap sahi order mein lag jayenge.</div>';return}
if(sel){const e=all.filter(r=>r.series.toLowerCase()===sel&&match(r)).sort(cmp);h=`<div class="sh"><button id="bk">${ic('back')}</button><h2>${esc(g[sel]?g[sel][0].series:'')}</h2><span>${e.length} videos</span></div>`+e.map(row).join('')}
else if(tab==='fold')h='<div class="gr">'+tiles(ks.filter(k=>k.includes(qq)))+'</div>';
else if(tab==='fav')L=all.filter(r=>r.fav&&match(r)).sort(cmp);
else if(tab==='hist')L=all.filter(r=>r.last&&match(r)).sort((a,b)=>b.last-a.last);
else{h=`<div class="sh"><h2>My Videos</h2><span>Total: ${all.length} videos</span></div><div class="tr">${tiles(ks)}</div>`;L=all.filter(match).sort(sortBy==='recent'?(a,b)=>b.added-a.added:cmp)}
if(L)h+=L.length?L.map(row).join(''):'<div class="empty">Yahan abhi kuch nahi hai</div>';M.innerHTML=h}
$('#main').onclick=e=>{const m=e.target.closest('[data-m]');if(m){const r=all.find(x=>x.id===decodeURIComponent(m.dataset.m));return r&&itemMenu(r)}
const s=e.target.closest('[data-s]');if(s){sel=decodeURIComponent(s.dataset.s);scrollTo(0,0);return render()}
if(e.target.closest('#bk')){sel=null;return render()}
const it=e.target.closest('.it');if(it)play(decodeURIComponent(it.dataset.id))};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;sel=null;render()}};
$('#nh').onclick=()=>{tab='lib';sel=null;$('#q').value='';scrollTo(0,0);render()};$('#q').oninput=render;
$('#srt').onclick=()=>{sortBy=sortBy==='name'?'recent':'name';toast('Sort: '+(sortBy==='name'?'Naam / Episode':'Naye pehle'));render()};
$('#prem').onclick=()=>toast('Saare features free hain 😎');
$('#cont').onclick=()=>{const r=all.filter(x=>x.last).sort((a,b)=>b.last-a.last)[0]||[...all].sort(cmp)[0];r?play(r.id):toast('Pehle videos add karo')};
$('#free').onclick=()=>{const w=all.filter(r=>r.dur&&r.pos>r.dur*.9);if(!w.length)return toast('Koi poori dekhi hui video nahi mili');menu('Space khali karein',[{i:'trash',t:`${w.length} dekhi hui video delete (${sz(w.reduce((a,r)=>a+(r.size||0),0))})`,fn:()=>del(w.map(r=>r.id))},{t:'Cancel'}])};
// ---- menu
let MR=[];
function menu(t,rows){MR=rows;$('#shp').innerHTML=`<h3>${t}</h3>`+rows.map((r,i)=>{const n=`${r.i?ic(r.i):''}<span>${r.t}</span>`+(r.sw!=null?`<i class="sw ${r.sw?'on':''}"></i>`:`<em>${r.v||''}</em>${r.c?ic('chev'):''}`);return r.l?`<label class="mr" for="${r.l}" data-i="${i}">${n}</label>`:`<div class="mr" data-i="${i}">${n}</div>`}).join('');$('#sh').style.display='block'}
const closeM=()=>$('#sh').style.display='none';
$('#sh').onclick=e=>{const r=e.target.closest('.mr');if(!r){if(e.target.id==='sh')closeM();return}const c=MR,x=c[r.dataset.i];x.fn&&x.fn();if(MR===c&&!x.l)closeM()};
function itemMenu(r){menu(esc(title(r)),[{i:'heart',t:r.fav?'Favorites se hatao':'Favorites mein jodo',fn:()=>{r.fav=!r.fav;save(r);render()}},{i:'trash',t:'Delete',c:1,fn:()=>menu('Pakka delete karein?',[{i:'trash',t:'Haan, delete karo',fn:()=>del([r.id])},{t:'Cancel'}])}])}
// ---- player
let url=null,saveT=0,locked=false,cover=false,si=2,sleepMin=0,sl;const sps=[.5,.75,1,1.25,1.5,2];
function play(id){const r=all.find(x=>x.id===id);if(!r)return;list=all.filter(x=>x.series.toLowerCase()===r.series.toLowerCase()).sort(cmp);go(list.indexOf(r))}
function go(i){if(i<0||i>=list.length)return;idx=i;cur=list[i];cur.last=Date.now();if(url)URL.revokeObjectURL(url);v.querySelectorAll('track').forEach(t=>t.remove());url=URL.createObjectURL(cur.blob);v.src=url;
$('#vt').textContent=title(cur);$('#vm').textContent=[res(cur),sz(cur.size||0),cur.series].join(' • ');$('#pl').style.display='block';if(cur.sub)addSub(cur.sub,'Subtitle');
v.onloadedmetadata=()=>{if(!cur.w){cur.w=v.videoWidth;cur.h=v.videoHeight;cur.dur=v.duration}if(cur.pos>5&&cur.pos<v.duration-8)v.currentTime=cur.pos;v.playbackRate=sps[si];v.play().catch(()=>{})};showC()}
function persist(){if(!cur||!v.duration)return;cur.pos=v.currentTime;cur.dur=v.duration;save(cur)}
function closeP(){persist();v.pause();$('#pl').style.display='none';closeM();locked=false;$('#ul').style.display='none';if(document.fullscreenElement)document.exitFullscreen();try{screen.orientation.unlock()}catch(e){}rm='auto';load()}
$('#cl').onclick=closeP;
v.onplay=()=>{$('#pp').innerHTML=ic('pause');hideSoon()};v.onpause=()=>{$('#pp').innerHTML=ic('play');persist()};
const prog=()=>$('#sb').style.setProperty('--p',(v.duration?v.currentTime/v.duration*100:0)+'%');
v.ontimeupdate=()=>{if(!drag){$('#sb').value=v.duration?v.currentTime/v.duration*1000:0;prog()}$('#cu').textContent=fmt(v.currentTime);$('#du').textContent=fmt(v.duration||0);if(Date.now()-saveT>4000){saveT=Date.now();persist()}};
v.onended=()=>{cur.pos=0;cur.dur=v.duration;persist();idx<list.length-1?(toast('Next episode ...'),go(idx+1)):closeP()};
let drag=false;const sb=$('#sb');sb.oninput=()=>{drag=true;v.currentTime=sb.value/1000*v.duration;$('#sb').style.setProperty('--p',sb.value/10+'%')};sb.onchange=()=>drag=false;
const seek=d=>{v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d))};
$('#pp').onclick=()=>v.paused?v.play():v.pause();$('#b10').onclick=()=>seek(-10);$('#f10').onclick=()=>seek(10);
$('#nx').onclick=()=>go(idx+1);$('#pv').onclick=()=>go(idx-1);
$('#fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else{await document.documentElement.requestFullscreen();if(v.videoWidth>v.videoHeight)screen.orientation.lock('landscape').catch(()=>{})}}catch(e){toast('Fullscreen support nahi')}};
$('#lk').onclick=()=>{locked=true;ctl.classList.add('h');$('#ul').style.display='grid';toast('Screen lock ho gayi')};
$('#ul').onclick=()=>{locked=false;$('#ul').style.display='none';showC()};
// subtitles / audio / pip / settings
function addSub(vtt,label){const t=document.createElement('track');t.kind='subtitles';t.label=label;t.src=URL.createObjectURL(new Blob([vtt],{type:'text/vtt'}));t.default=true;v.appendChild(t);t.track.mode='showing'}
$('#sf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let t=await f.text();if(!/^\s*WEBVTT/.test(t))t='WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2');v.querySelectorAll('track').forEach(x=>x.remove());addSub(t,f.name);cur.sub=t;save(cur);toast('Subtitle lag gaya')};
function subMenu(){const ts=Array.from(v.textTracks);menu('Subtitle',[{i:'cc',t:'Off',v:ts.every(t=>t.mode!=='showing')?'✓':'',fn:()=>ts.forEach(t=>t.mode='disabled')},...ts.map((t,i)=>({i:'cc',t:esc(t.label||t.language||'Track '+(i+1)),v:t.mode==='showing'?'✓':'',fn:()=>ts.forEach(x=>x.mode=x===t?'showing':'disabled')})),{i:'add',t:'Subtitle file chuno (.srt / .vtt)',l:'sf'}])}
function audMenu(){const a=Array.from(v.audioTracks||[]);if(a.length<2)return toast('Is video ya browser mein alag audio track nahi mila');menu('Audio Track',a.map((t,i)=>({i:'music',t:esc(t.label||t.language||'Track '+(i+1)),v:t.enabled?'✓':'',fn:()=>a.forEach((x,j)=>x.enabled=j===i)})))}
async function pip(){try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else await v.requestPictureInPicture()}catch(e){toast('PiP is browser mein supported nahi')}}
function setMenu(){const sh=Array.from(v.textTracks).find(t=>t.mode==='showing');menu('Settings',[
{i:'speed',t:'Playback Speed',v:sps[si]+'x',c:1,fn:()=>menu('Playback Speed',sps.map((s,i)=>({i:'speed',t:s+'x',v:i===si?'✓':'',fn:()=>{si=i;v.playbackRate=s}})))},
{i:'cc',t:'Subtitle',v:sh?esc(sh.label||'On'):'Off',c:1,fn:subMenu},
{i:'music',t:'Audio Track',v:'',c:1,fn:audMenu},
{i:'clock',t:'Sleep Timer',v:sleepMin?sleepMin+' min':'Off',c:1,fn:()=>menu('Sleep Timer',[0,15,30,60,90].map(m=>({i:'clock',t:m?m+' min':'Off',v:m===sleepMin?'✓':'',fn:()=>{sleepMin=m;clearTimeout(sl);if(m)sl=setTimeout(()=>{v.pause();toast('Sleep timer: video ruk gayi')},m*60000)}})))},
{i:'pip',t:'Picture in Picture',sw:!!document.pictureInPictureElement,fn:pip},
{i:'rep',t:'Repeat',sw:v.loop,fn:()=>{v.loop=!v.loop;setMenu()}},
{i:'rot',t:'Screen Rotation',v:rm==='auto'?'Auto':rm==='landscape'?'Landscape':'Portrait',c:1,fn:()=>menu('Screen Rotation',[['auto','Auto'],['landscape','Landscape (aada)'],['portrait','Portrait (khada)']].map(([m,t])=>({i:'rot',t,v:rm===m?'✓':'',fn:()=>setOri(m)})))},
{i:'fs',t:'Aspect',v:cover?'Fill':'Original',fn:()=>{cover=!cover;v.style.objectFit=cover?'cover':'contain';setMenu()}}])}
$('#bmo').onclick=setMenu;$('#bcc').onclick=subMenu;
let rm='auto';
async function setOri(m){try{if(m==='auto')screen.orientation.unlock();else{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();await screen.orientation.lock(m)}rm=m;toast({auto:'Auto rotate',landscape:'Landscape (aada)',portrait:'Portrait (khada)'}[m])}catch(e){toast('Rotate is browser mein supported nahi')}}
$('#rt').onclick=()=>setOri(innerWidth>innerHeight?'portrait':'landscape');
// controls & gestures
let ht;const ctl=$('#ctl');function showC(){ctl.classList.remove('h');hideSoon()}function hideSoon(){clearTimeout(ht);ht=setTimeout(()=>{if(!v.paused)ctl.classList.add('h')},3200)}
function hud(t){const h=$('#hud');h.textContent=t;h.style.display='block';clearTimeout(h._t);h._t=setTimeout(()=>h.style.display='none',700)}
let G=null,lastTap=0,tapT,bri=1,lp;const PL=$('#pl');
PL.addEventListener('pointerdown',e=>{if(locked||e.target.closest('button,input'))return;G={x:e.clientX,y:e.clientY,m:null,t:v.currentTime,vol:v.volume,bri,lp:false};lp=setTimeout(()=>{if(G&&!G.m){G.lp=true;v.playbackRate=2;hud('⚡ 2x')}},450)});
PL.addEventListener('pointermove',e=>{if(!G)return;const dx=e.clientX-G.x,dy=e.clientY-G.y,w=innerWidth,h=innerHeight;
if(!G.m&&Math.max(Math.abs(dx),Math.abs(dy))>14){clearTimeout(lp);G.m=Math.abs(dx)>Math.abs(dy)?'s':(G.x<w/2?'b':'v')}
if(G.m==='s'){const t=Math.max(0,Math.min(v.duration||0,G.t+dx/w*120));v.currentTime=t;hud((dx>=0?'⏩ ':'⏪ ')+fmt(t))}
else if(G.m==='b'){bri=Math.max(.1,Math.min(1,G.bri-dy/h*1.3));$('#dim').style.opacity=1-bri;hud('☀ '+Math.round(bri*100)+'%')}
else if(G.m==='v'){v.volume=Math.max(0,Math.min(1,G.vol-dy/h*1.3));hud('🔊 '+Math.round(v.volume*100)+'%')}});
PL.addEventListener('pointerup',e=>{if(!G)return;clearTimeout(lp);const g=G;G=null;if(g.lp){v.playbackRate=sps[si];return}if(g.m)return;
const n=Date.now();if(n-lastTap<300){clearTimeout(tapT);lastTap=0;const d=e.clientX<innerWidth/2?-10:10;seek(d);hud(d>0?'+10s ⏩':'⏪ −10s')}else{lastTap=n;tapT=setTimeout(()=>ctl.classList.contains('h')?showC():ctl.classList.add('h'),300)}});
PL.addEventListener('pointercancel',()=>{G=null;clearTimeout(lp);v.playbackRate=sps[si]});
addEventListener('keydown',e=>{if($('#pl').style.display!=='block')return;if(e.key==='ArrowRight')seek(10);if(e.key==='ArrowLeft')seek(-10);if(e.key===' ')$('#pp').click();if(e.key==='f')$('#fs').click()});
addEventListener('pagehide',persist);
opn().then(load).catch(()=>{toast('Storage block hai: videos sirf is session tak rahengi');load()});
</script></body></html>
